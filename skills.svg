<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <defs>
    <style><![CDATA[
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }

      /* Theme Colors */
      .bg { fill: #0a0e14; }
      .panel { fill: #0d1320; stroke: #1f2b3d; stroke-width: 1; }
      .head { fill: #0a1018; stroke: #1f2b3d; stroke-width: 1; }
      .title { fill: #5a6b82; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; letter-spacing: 2px; }
      
      /* Typography */
      .category-label { fill: #5a6b82; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 2px; }
      .tag-text { fill: #b9c8dc; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
      .tag-bg { fill: #131d2c; stroke: #1d2a3d; stroke-width: 1; }
      
      /* Footer */
      .footer { fill: #5a6b82; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2px; }
      .cursor { fill: #00ff9c; animation: blink 1.2s steps(2) infinite; }
      
      /* Staggered Fade In Animations */
      .f-1 { animation: fadeIn 0.5s ease-out both; }
      .f-2 { animation: fadeIn 0.5s ease-out 0.1s both; }
      .f-3 { animation: fadeIn 0.5s ease-out 0.2s both; }
      .f-4 { animation: fadeIn 0.5s ease-out 0.3s both; }
      .f-5 { animation: fadeIn 0.5s ease-out 0.4s both; }
      .f-6 { animation: fadeIn 0.5s ease-out 0.5s both; }
      .f-7 { animation: fadeIn 0.5s ease-out 0.6s both; }
      .f-8 { animation: fadeIn 0.5s ease-out 0.7s both; }
      .f-9 { animation: fadeIn 0.5s ease-out 0.8s both; }
      .f-10 { animation: fadeIn 0.5s ease-out 0.9s both; }
      .f-11 { animation: fadeIn 0.5s ease-out 1.0s both; }
      .f-12 { animation: fadeIn 0.5s ease-out 1.1s both; }
    ]]></style>
  </defs>

  <!-- background -->
  <rect class="bg" width="760" height="420" rx="10"/>
  <rect class="panel" x="1" y="1" width="758" height="418" rx="10"/>

  <!-- header -->
  <rect class="head" x="1" y="1" width="758" height="42" rx="10"/>
  <rect class="head" x="1" y="20" width="758" height="23"/>
  <circle cx="24" cy="22" r="5" fill="#ff5f57"/>
  <circle cx="42" cy="22" r="5" fill="#febc2e"/>
  <circle cx="60" cy="22" r="5" fill="#28c840"/>
  <text class="title" x="740" y="26" text-anchor="end">SKILL_MATRIX // ALAN.M.JOSE</text>

  <!-- Row 1: Languages -->
  <g class="f-1">
    <text class="category-label" x="40" y="80">LANGUAGES</text>
    
    <rect class="tag-bg" x="40" y="95" width="90" height="26" rx="4"/>
    <text class="tag-text" x="54" y="113">C / C11</text>

    <rect class="tag-bg" x="140" y="95" width="70" height="26" rx="4"/>
    <text class="tag-text" x="154" y="113">C++20</text>

    <rect class="tag-bg" x="220" y="95" width="90" height="26" rx="4"/>
    <text class="tag-text" x="234" y="113">Assembly</text>

    <rect class="tag-bg" x="320" y="95" width="60" height="26" rx="4"/>
    <text class="tag-text" x="334" y="113">Rust</text>
  </g>

  <!-- Row 2: Subsystems -->
  <g class="f-2">
    <text class="category-label" x="40" y="155">SUBSYSTEMS</text>
    
    <rect class="tag-bg" x="40" y="170" width="100" height="26" rx="4"/>
    <text class="tag-text" x="54" y="188">Linux Kernel</text>

    <rect class="tag-bg" x="150" y="170" width="100" height="26" rx="4"/>
    <text class="tag-text" x="164" y="188">Memory Mgmt</text>

    <rect class="tag-bg" x="260" y="170" width="95" height="26" rx="4"/>
    <text class="tag-text" x="274" y="188">Concurrency</text>

    <rect class="tag-bg" x="365" y="170" width="60" height="26" rx="4"/>
    <text class="tag-text" x="379" y="188">POSIX</text>
  </g>

  <!-- Row 3: Toolchain -->
  <g class="f-3">
    <text class="category-label" x="40" y="230">TOOLCHAIN</text>
    
    <rect class="tag-bg" x="40" y="245" width="50" height="26" rx="4"/>
    <text class="tag-text" x="54" y="263">GDB</text>

    <rect class="tag-bg" x="100" y="245" width="80" height="26" rx="4"/>
    <text class="tag-text" x="114" y="263">Valgrind</text>

    <rect class="tag-bg" x="190" y="245" width="60" height="26" rx="4"/>
    <text class="tag-text" x="204" y="263">QEMU</text>

    <rect class="tag-bg" x="260" y="245" width="100" height="26" rx="4"/>
    <text class="tag-text" x="274" y="263">GCC / Clang</text>
  </g>

  <!-- Row 4: Core Domains -->
  <g class="f-4">
    <text class="category-label" x="40" y="305">CORE DOMAINS</text>
    
    <rect class="tag-bg" x="40" y="320" width="110" height="26" rx="4"/>
    <text class="tag-text" x="54" y="338">Allocators</text>

    <rect class="tag-bg" x="160" y="320" width="130" height="26" rx="4"/>
    <text class="tag-text" x="174" y="338">Custom Modules</text>

    <rect class="tag-bg" x="300" y="320" width="90" height="26" rx="4"/>
    <text class="tag-text" x="314" y="338">Syscalls</text>
    
    <rect class="tag-bg" x="400" y="320" width="110" height="26" rx="4"/>
    <text class="tag-text" x="414" y="338">GDB Dumps</text>
  </g>

  <!-- Footer -->
  <line x1="40" y1="370" x2="720" y2="370" stroke="#1a2436" stroke-dasharray="4 4"/>
  
  <text class="footer" x="40" y="395">$ ./load_skills --all</text>
  <rect class="cursor" x="190" y="385" width="8" height="14"/>
  <text class="footer" x="720" y="395" text-anchor="end">OK // 0x00</text>

</svg>
