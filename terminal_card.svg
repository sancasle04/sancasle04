<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <defs>
    <style><![CDATA[
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 2px #00ff9c); }
        50% { filter: drop-shadow(0 0 10px #00ff9c); }
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
      @keyframes type {
        from { width: 0; }
        to { width: 100%; }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }

      .bg { fill: #0a0e14; }
      .panel { fill: #0d1320; stroke: #1f2b3d; stroke-width: 1; }
      .head { fill: #0a1018; stroke: #1f2b3d; stroke-width: 1; }
      .dot-r { fill: #ff5f57; }
      .dot-y { fill: #febc2e; }
      .dot-g { fill: #28c840; }
      .title { fill: #5a6b82; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; letter-spacing: 2px; }
      .name { fill: #eaf2ff; font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; animation: glow 3s ease-in-out infinite; }
      .handle { fill: #00ff9c; font-family: 'JetBrains Mono', monospace; font-size: 12px; opacity: 0.8; }
      .status-bg { fill: #00ff9c0d; stroke: #00ff9c40; stroke-width: 1; }
      .status-text { fill: #00ff9c; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1.5px; }
      .status-dot { fill: #00ff9c; animation: blink 1.6s ease-in-out infinite; }
      .box { fill: #0b111b; stroke: #1f2b3d; stroke-width: 1; }
      .label { fill: #5a6b82; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 2px; }
      .tag { fill: #b9c8dc; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .tag-bg { fill: #131d2c; stroke: #1d2a3d; stroke-width: 1; }
      .domain-code { fill: #ffb86b; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .domain-text { fill: #c9d4e3; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .footer { fill: #5a6b82; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 2px; }
      .cursor { fill: #00ff9c; animation: blink 1.2s steps(2) infinite; }
      .sweep { fill: #00ff9c; opacity: 0.15; animation: scanline 3s linear infinite; }
      .fade-1 { animation: fadeIn 0.6s ease-out both; }
      .fade-2 { animation: fadeIn 0.6s ease-out 0.15s both; }
      .fade-3 { animation: fadeIn 0.6s ease-out 0.3s both; }
      .fade-4 { animation: fadeIn 0.6s ease-out 0.45s both; }
      .fade-5 { animation: fadeIn 0.6s ease-out 0.6s both; }
    ]]></style>
  </defs>

  <!-- background -->
  <rect class="bg" width="760" height="420" rx="10"/>
  <rect class="panel" x="1" y="1" width="758" height="418" rx="10"/>

  <!-- scanline overlay -->
  <rect class="sweep" x="0" y="0" width="760" height="420"/>

  <!-- header -->
  <rect class="head" x="1" y="1" width="758" height="42" rx="10"/>
  <rect class="head" x="1" y="20" width="758" height="23"/>
  <circle class="dot-r" cx="24" cy="22" r="5"/>
  <circle class="dot-y" cx="42" cy="22" r="5"/>
  <circle class="dot-g" cx="60" cy="22" r="5"/>
  <text class="title" x="740" y="26" text-anchor="end">SYSTEM_MANIFEST // ALAN.M.JOSE</text>

  <!-- name row -->
  <g class="fade-1">
    <text class="name" x="32" y="88">ALAN M. JOSE</text>
    <text class="handle" x="230" y="88">@sancasle04</text>
  </g>

  <!-- status badge -->
  <g class="fade-1">
    <rect class="status-bg" x="580" y="70" width="110" height="24" rx="12"/>
    <circle class="status-dot" cx="596" cy="82" r="4"/>
    <text class="status-text" x="608" y="86">NOMINAL</text>
  </g>

  <!-- spec boxes -->
  <g class="fade-2">
    <!-- Languages -->
    <rect class="box" x="24" y="112" width="228" height="96" rx="8"/>
    <text class="label" x="40" y="134">LANGUAGES</text>
    <rect class="tag-bg" x="40" y="144" width="72" height="22" rx="4"/>
    <text class="tag" x="48" y="159">C11 / C99</text>
    <rect class="tag-bg" x="118" y="144" width="56" height="22" rx="4"/>
    <text class="tag" x="126" y="159">C++20</text>
    <rect class="tag-bg" x="180" y="144" width="64" height="22" rx="4"/>
    <text class="tag" x="188" y="159">x86_64</text>
    <rect class="tag-bg" x="40" y="172" width="52" height="22" rx="4"/>
    <text class="tag" x="48" y="187">Rust</text>

    <!-- Subsystems -->
    <rect class="box" x="264" y="112" width="228" height="96" rx="8"/>
    <text class="label" x="280" y="134">SUBSYSTEMS</text>
    <rect class="tag-bg" x="280" y="144" width="72" height="22" rx="4"/>
    <text class="tag" x="288" y="159">Linux Kernel</text>
    <rect class="tag-bg" x="358" y="144" width="78" height="22" rx="4"/>
    <text class="tag" x="366" y="159">Memory Mgmt</text>
    <rect class="tag-bg" x="280" y="172" width="80" height="22" rx="4"/>
    <text class="tag" x="288" y="187">Concurrency</text>
    <rect class="tag-bg" x="366" y="172" width="48" height="22" rx="4"/>
    <text class="tag" x="374" y="187">POSIX</text>

    <!-- Toolchain -->
    <rect class="box" x="504" y="112" width="232" height="96" rx="8"/>
    <text class="label" x="520" y="134">TOOLCHAIN</text>
    <rect class="tag-bg" x="520" y="144" width="44" height="22" rx="4"/>
    <text class="tag" x="528" y="159">GDB</text>
    <rect class="tag-bg" x="570" y="144" width="64" height="22" rx="4"/>
    <text class="tag" x="578" y="159">Valgrind</text>
    <rect class="tag-bg" x="640" y="144" width="48" height="22" rx="4"/>
    <text class="tag" x="648" y="159">QEMU</text>
    <rect class="tag-bg" x="520" y="172" width="88" height="22" rx="4"/>
    <text class="tag" x="528" y="187">GCC / Clang</text>
  </g>

  <!-- domains -->
  <g class="fade-3">
    <rect x="24" y="224" width="4" height="20" fill="#1d2a3d"/>
    <text class="domain-code" x="40" y="238">0x0001</text>
    <text class="domain-text" x="100" y="238">[SYSTEMS] allocators, cache-friendly structures, pthreads</text>
  </g>
  <g class="fade-4">
    <rect x="24" y="252" width="4" height="20" fill="#1d2a3d"/>
    <text class="domain-code" x="40" y="266">0x0002</text>
    <text class="domain-text" x="100" y="266">[KERNEL] custom modules, syscalls, virtual memory</text>
  </g>
  <g class="fade-5">
    <rect x="24" y="280" width="4" height="20" fill="#1d2a3d"/>
    <text class="domain-code" x="40" y="294">0x0003</text>
    <text class="domain-text" x="100" y="294">[TOOLING] bare-metal QEMU, GDB dumps, Valgrind profiles</text>
  </g>

  <!-- footer -->
  <line x1="24" y1="330" x2="736" y2="330" stroke="#1a2436" stroke-dasharray="4 4"/>
  <text class="footer" x="24" y="356">CORE ACTIVE</text>
  <rect class="cursor" x="110" y="346" width="6" height="12"/>
  <text class="footer" x="736" y="356" text-anchor="end">0x00 // ALL SYSTEMS NOMINAL</text>
</svg>